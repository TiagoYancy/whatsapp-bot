services:
  bot:
    build: .
    container_name: whatsapp-faq-bot
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      DB_PATH: /app/data/bot.db
    volumes:
      - bot_data:/app/data
    extra_hosts:
      # permite falar com Ollama rodando no host (Linux)
      - "host.docker.internal:host-gateway"

volumes:
  bot_data:
